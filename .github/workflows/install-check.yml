name: Install check
on:
  workflow_run:
    workflows: ["Release binaries"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (empty uses latest release)"
        default: ""
permissions:
  contents: read
  attestations: read
jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: GhostPawJS/telegram
      REQUESTED_VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
    steps:
      - name: Install and verify (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then version=$(gh release view --json tagName --jq .tagName); fi
          version="${version#v}"
          export GHOSTPAW_INSTALL_DIR="$RUNNER_TEMP/telegram-bin"
          export PATH="$GHOSTPAW_INSTALL_DIR:$PATH"
          if [ "$RUNNER_OS" = Linux ]; then export GHOSTPAW_VERIFY=attestation; fi
          curl -fsSL https://raw.githubusercontent.com/GhostPawJS/telegram/main/install.sh | sh -s -- --version "$version"
          test "$(ghostpaw-telegram --version)" = "$version"
          echo "Version: $version verified on $RUNNER_OS" >> "$GITHUB_STEP_SUMMARY"
          # Local mirror reads and send plans succeed offline without a bot token.
          ghostpaw-telegram --help
          ghostpaw-telegram tools --json | jq -e 'length == 4'
          ghostpaw-telegram mirror chats --db "$RUNNER_TEMP/telegram.db" --json | jq -e '.ok == true'
          ghostpaw-telegram message send 123 'Install plan' --db "$RUNNER_TEMP/telegram.db" --json | jq -e '.ok == true and .data.action == "send_message"'
          echo 'Local read and send plan: passed' >> "$GITHUB_STEP_SUMMARY"
          cat > "$RUNNER_TEMP/requests.jsonl" <<'JSON'
          {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"install-check","version":"1"}}}
          {"jsonrpc":"2.0","method":"notifications/initialized"}
          {"jsonrpc":"2.0","id":2,"method":"tools/list"}
          JSON
          ghostpaw-telegram mcp --db "$RUNNER_TEMP/telegram.db" < "$RUNNER_TEMP/requests.jsonl" > "$RUNNER_TEMP/mcp.jsonl" &
          child=$!
          (sleep 20; kill "$child" 2>/dev/null || true) &
          watchdog=$!
          wait "$child"
          kill "$watchdog" 2>/dev/null || true
          jq -se 'any(.[]; .id == 1 and .result.serverInfo != null) and any(.[]; .id == 2 and any(.result.tools[]; .name == "tg_read"))' "$RUNNER_TEMP/mcp.jsonl"
          echo 'MCP initialize and tools/list: passed' >> "$GITHUB_STEP_SUMMARY"
      - name: Install and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:REQUESTED_VERSION
          if (-not $version) { $version = gh release view --json tagName --jq .tagName }
          $version = $version.TrimStart('v')
          $env:GHOSTPAW_VERSION = $version
          $env:GHOSTPAW_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'telegram-bin'
          irm https://raw.githubusercontent.com/GhostPawJS/telegram/main/install.ps1 | iex
          if ((ghostpaw-telegram --version) -ne $version) { throw 'Version mismatch' }
          "Version: $version verified on Windows" >> $env:GITHUB_STEP_SUMMARY
          ghostpaw-telegram --help
          $tools = @(ghostpaw-telegram tools --json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $tools.Count -ne 4) { throw 'Tool list failed' }
          $db = Join-Path $env:RUNNER_TEMP 'telegram.db'
          $added = ghostpaw-telegram mirror chats --db $db --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $added.ok) { throw 'Local mirror read failed' }
          $plan = ghostpaw-telegram message send 123 'Install plan' --db $db --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $plan.ok -or $plan.data.action -ne 'send_message') { throw 'Send plan failed' }
          'Local read and send plan: passed' >> $env:GITHUB_STEP_SUMMARY
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $env:GHOSTPAW_INSTALL_DIR 'ghostpaw-telegram.exe'), "mcp --db `"$db`"")
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $process = [Diagnostics.Process]::Start($start)
          $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"install-check","version":"1"}}}')
          $process.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
          $process.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          $process.StandardInput.Close()
          $output = $process.StandardOutput.ReadToEndAsync()
          if (-not $process.WaitForExit(20000)) { $process.Kill(); throw 'MCP timeout' }
          $messages = $output.Result.Trim() -split "`n" | ForEach-Object { $_ | ConvertFrom-Json }
          if (-not ($messages | Where-Object { $_.id -eq 1 -and $_.result.serverInfo })) { throw 'Missing serverInfo' }
          if (-not ($messages | Where-Object { $_.id -eq 2 -and 'tg_read' -in $_.result.tools.name })) { throw 'Missing tg_read' }
          'MCP initialize and tools/list: passed' >> $env:GITHUB_STEP_SUMMARY
      # Network verification belongs only in this release install check.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Public TLS handshake
        run: >-
          node -e "const tls = require('node:tls'); const s = tls.connect({host:'api.telegram.org',port:443,servername:'api.telegram.org'}, () => { if (!s.authorized) process.exitCode = 1; s.end(); }); s.setTimeout(15000, () => s.destroy(new Error('TLS timeout'))); s.on('error', e => { console.error(e.message); process.exitCode = 1; });"
